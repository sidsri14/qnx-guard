[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-guard"
version = "0.1.0"
description = "Static Real-Time Safety & Security Linter for QNX SDP 8.0 Neutrino Systems"
readme = "README.md"
authors = [{ name = "Siddharth Srivastava", email = "sidsri1302@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
requires-python = ">=3.9"

[project.scripts]
qnx-guard = "qnx_guard.cli:main"
